<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8edbd5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ひかるピアノ">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="ひかった鍵盤を順番にタップして遊ぶ、子ども向けピアノゲーム">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="piano-star.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <title>ひかるピアノ</title>
  </head>
  <body>
    <main id="app">
      <section id="home-screen" class="screen home-screen" aria-labelledby="home-title">
        <div class="cloud cloud-a" aria-hidden="true"></div>
        <div class="cloud cloud-b" aria-hidden="true"></div>
        <header class="home-header">
          <span class="music-note" aria-hidden="true">♪</span>
          <div>
            <h1 id="home-title">ひかるピアノ</h1>
            <p>ひかった けんばんを おしてね！</p>
          </div>
          <span class="music-note note-right" aria-hidden="true">♫</span>
        </header>
        <div id="song-list" class="song-list" aria-label="きょくをえらぶ"></div>
      </section>

      <section id="game-screen" class="screen game-screen is-hidden" aria-labelledby="song-title">
        <header class="game-header">
          <button id="back-button" class="round-button" type="button" aria-label="きょくえらびにもどる">← <span>もどる</span></button>
          <div class="song-status">
            <h2 id="song-title"></h2>
            <div class="progress-row">
              <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
              <span id="progress-text" aria-live="polite"></span>
            </div>
          </div>
          <button id="sound-button" class="round-button sound-button" type="button" aria-label="おとをオン・オフする">🔊</button>
        </header>
        <div class="prompt" aria-live="polite"><span class="prompt-star">★</span> ひかった けんばんを おしてね！</div>
        <div id="piano-wrap" class="piano-wrap">
          <div id="piano" class="piano" role="group" aria-label="ピアノのけんばん"></div>
          <div id="sparkles" class="sparkles" aria-hidden="true"></div>
        </div>
      </section>

      <div id="clear-dialog" class="clear-dialog is-hidden" role="dialog" aria-modal="true" aria-labelledby="clear-title">
        <div class="celebration" aria-hidden="true">
          <span>★</span><span>✦</span><span>★</span><span>✦</span><span>★</span>
        </div>
        <div class="clear-card">
          <div class="big-star" aria-hidden="true">★</div>
          <h2 id="clear-title">クリア！</h2>
          <p>じょうずに ひけたね！</p>
          <div class="clear-actions">
            <button id="retry-button" class="action-button retry-button" type="button">↻ もういちど</button>
            <button id="songs-button" class="action-button songs-button" type="button">♪ ほかのきょく</button>
          </div>
        </div>
      </div>

      <aside class="rotate-notice" aria-label="よこがめんのあんない">
        <div class="phone-icon" aria-hidden="true">↻</div>
        <h2>よこにして あそんでね</h2>
        <p>iPhoneを よこむきに してね！</p>
      </aside>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
